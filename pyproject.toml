[project]
name = "edgebench"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aravind", email = "aravind@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "onnx>=1.23.2",
    "onnxruntime>=1.31.1",
    "opencv-python>=5.0.0.93",
    "pillow>=13.0.0",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]

[project.scripts]
edgebench = "edgebench:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
